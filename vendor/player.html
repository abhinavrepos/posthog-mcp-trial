<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; }
        .PlayerFrame {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1d1f27;
        }
        .PlayerFrame__content-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .PlayerFrame__content { position: absolute; top: 0; left: 0; }
        #metadata-footer {
            display: none;
            background: #000;
            color: #fff;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 22px;
            padding: 6px 12px;
            /* Fixed widths in the monospace font keep the first row's fields from moving as their values change. */
            grid-template-columns: 1fr 13ch 16ch 25ch 1fr;
            grid-template-areas: ". rect window status ." "url url url url url";
            align-items: center;
            column-gap: 16px;
            white-space: nowrap;
            overflow: hidden;
        }
        #metadata-footer .label { font-weight: bold; }
        #metadata-footer .rect { grid-area: rect; }
        #metadata-footer .window { grid-area: window; }
        #metadata-footer .url { grid-area: url; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        #metadata-footer .status { grid-area: status; }
        #metadata-footer .status-ended { font-weight: bold; color: #4ade80; }
        #metadata-footer .status-idle { font-weight: bold; color: #facc15; }
        #metadata-footer .status-active { font-weight: bold; color: #60a5fa; }
        .PlayerFrame__content .replayer-wrapper { position: relative; }
        .PlayerFrame__content iframe { background-color: white; border: 0; }
