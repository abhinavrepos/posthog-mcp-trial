# Optional front door for environments that require nginx. The Node proxy at
# 127.0.0.1:8091 performs the HTML injection and per-session friction routing.
# Do not use nginx sub_filter here: it would bypass the case-specific labels.
server {
    listen 127.0.0.1:8092;
    server_name _;
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
